spring.application.name=catalog-service
spring.config.import=optional:file:.env[.properties]

# Base propia
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${DB_SCHEMA}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# El esquema solo lo cambian las migraciones
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Redis y Kafka de la cátedra: se conectan recién cuando se usan
spring.data.redis.host=${REDIS_HOST:}
spring.data.redis.port=${REDIS_PORT:6379}
# La cátedra da un usuario propio de Redis, con lectura solo sobre catedra:sync:*
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
# Si Redis no responde a tiempo, la sincronización falla y reintenta después
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:3s}
spring.data.redis.timeout=${REDIS_TIMEOUT:3s}
# Si Redis no responde, cada lectura se reintenta con estas esperas entre intento e intento
catedra.redis.retry-delays=${CATEDRA_REDIS_RETRY_DELAYS:1s,2s,4s}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:}
# El consumer group y el topic de avisos del catálogo vienen en la configuración de la integración de la cátedra
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:}
catedra.kafka.catalog-topic=${KAFKA_CATALOG_TOPIC:}
# Un aviso publicado antes del primer arranque no hace falta: el arranque ya sincroniza
spring.kafka.consumer.auto-offset-reset=latest
# El listener confirma el offset recién cuando la sincronización terminó
spring.kafka.listener.ack-mode=manual
catalog.sync.notification-listener-enabled=${CATALOG_SYNC_NOTIFICATION_LISTENER_ENABLED:true}

# API REST de la cátedra: de acá se baja el snapshot del catálogo
catedra.api.base-url=${CATEDRA_API_URL:}
# El JWT técnico dura un año y se comparte con el servicio de turnos. Nunca va a un log ni a una respuesta
catedra.api.token=${CATEDRA_API_TOKEN:}
# El snapshot es la respuesta más grande: por eso la lectura tiene más margen que la conexión
catedra.api.connect-timeout=${CATEDRA_API_CONNECT_TIMEOUT:3s}
catedra.api.read-timeout=${CATEDRA_API_READ_TIMEOUT:10s}
# Si la cátedra no responde, se reintenta con estas esperas entre intento e intento (sin reintentos dentro de reintentos)
catedra.api.retry-delays=${CATEDRA_API_RETRY_DELAYS:1s,2s,4s}

# El catálogo se sincroniza solo al arrancar y cada tanto, aunque se pierda un aviso de Kafka (decisión 10)
catalog.sync.automatic-triggers-enabled=${CATALOG_SYNC_AUTOMATIC_TRIGGERS_ENABLED:true}
catalog.sync.reconcile-interval=${CATALOG_SYNC_RECONCILE_INTERVAL:2m}

# Sin la cátedra el servicio sigue respondiendo con su copia local
management.health.redis.enabled=false

# El health es público: muestra solo el estado, sin detalles internos
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# Los grupos liveness/readiness son para Kubernetes: acá solo agregarían su lista a la respuesta
management.endpoint.health.probes.enabled=false
