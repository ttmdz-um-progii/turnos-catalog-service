# Spring carga este archivo además del application.properties principal, y solo existe en los tests. Sin esto, cada
# contexto de test sincronizaría el catálogo al arrancar, cada dos minutos y con cada aviso de Kafka. El listener no
# se apaga con spring.kafka.listener.auto-startup: cuando un test reusa un contexto cacheado, Spring lo reinicia y
# arranca todos los listeners igual
catalog.sync.automatic-triggers-enabled=false
catalog.sync.notification-listener-enabled=false
